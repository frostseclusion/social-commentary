name: check

# 每次改动文章跑一次：frontmatter 校验 + 检查生成物（README 目录、feed.xml）是否和文章一致。
#
# 这个工作流**不写仓库**。目录和 feed 由本地构建生成、和文章一起提交；CI 只负责发现
# "你忘了跑 build" 这种情况。以前它会在 CI 里重建并推回仓库，结果会和本地推送撞车
# （远端已经被本地更新，CI 的 push 被拒）—— 2026-11-12 改成只检查。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 校验 frontmatter 与文章
        run: node scripts/build.mjs --check

      - name: 检查生成物是否已更新
        run: |
          node scripts/build.mjs
          if ! git diff --quiet -- README.md feed.xml; then
            echo "::error::README 的目录或 feed.xml 与文章内容不一致。本地跑一次 node scripts/build.mjs，把结果和文章一起提交。"
            git diff --stat
            exit 1
          fi
          echo "生成物是最新的"
